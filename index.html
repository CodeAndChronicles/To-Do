<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Nova Glass — a glassmorphic task manager with pages, cards, six color palettes and advanced appearance controls.">
<meta name="theme-color" content="#6d28d9" id="themeColorMeta">
<meta name="color-scheme" content="light dark">
<title>Nova Glass | Ultimate Task Manager</title>

<!-- Iconify (with graceful fallback) -->
<script id="iconifyScript" src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

<style>
/* ============================================================
   1. DESIGN TOKENS
   All values below are set dynamically by JS (applyAppearance).
   Defaults here keep the app readable if JS fails briefly.
   ============================================================ */
:root{
  /* fallback palette (purple-haze / light) */
  --bg-1:#f5f0ff; --bg-2:#ede4ff; --bg-3:#e4d9ff;
  --bg-flat:#ede4ff; --bg-intensity:0.6;
  --surface:rgba(255,255,255,0.72);
  --surface-2:rgba(255,255,255,0.55);
  --surface-3:rgba(255,255,255,0.38);
  --surface-solid:#ffffff;
  --border:rgba(46,16,101,0.12);
  --border-soft:rgba(46,16,101,0.07);
  --text:#2e1065;
  --text-muted:#5b4b7a;
  --primary:#7c3aed;
  --accent:#a855f7;
  --primary-soft:rgba(124,58,237,0.16);
  --accent-soft:rgba(168,85,247,0.16);
  --success:#059669;
  --warning:#b45309;
  --danger:#dc2626;
  --success-soft:rgba(5,150,105,0.14);
  --warning-soft:rgba(180,83,9,0.14);
  --danger-soft:rgba(220,38,38,0.14);
  --shadow:0 6px 24px rgba(46,16,101,0.10);
  --shadow-lg:0 16px 48px rgba(46,16,101,0.18);
  --blur:16px;
  --radius:16px;
  --radius-sm:10px;
  --radius-lg:24px;

  /* spacing (scaled by density) */
  --pad-card:1.25rem;
  --pad-section:1rem;
  --gap-list:0.75rem;
  --gap-grid:1rem;
  --gap-row:0.75rem;

  /* motion */
  --t-fast:0.16s;
  --t:0.24s;
  --t-slow:0.4s;
  --ease:cubic-bezier(.22,.61,.36,1);

  /* layout */
  --sidebar-w:264px;
  --sidebar-w-collapsed:76px;
  --topbar-h:60px;
  --bottom-nav-h:66px;
}

body.density-compact{
  --pad-card:0.85rem;
  --pad-section:0.7rem;
  --gap-list:0.5rem;
  --gap-grid:0.7rem;
  --gap-row:0.5rem;
}

/* ============================================================
   2. RESET & BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%; font-size:16px;}
html,body{overflow-x:hidden;}
body{
  margin:0;
  min-height:100vh;
  min-height:100dvh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  font-size:1rem;
  line-height:1.55;
  color:var(--text);
  background:var(--bg-1);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:linear-gradient(135deg,var(--bg-1) 0%,var(--bg-2) 50%,var(--bg-3) 100%);
  background-attachment:fixed;
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;
  background:var(--bg-flat);
  opacity:calc(1 - var(--bg-intensity));
  pointer-events:none;
  transition:opacity var(--t) var(--ease);
}
h1,h2,h3,h4,p,ul,li,figure{margin:0;}
ul{list-style:none;padding:0;}
button{font:inherit;color:inherit;}
input,textarea,select{font:inherit;color:inherit;}
a{color:var(--accent);text-decoration:none;}
img{max-width:100%;display:block;}

:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px;}

.sr-only{
  position:absolute;width:1px;height:1px;padding:0;margin:-1px;
  overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
}

.skip-link{
  position:fixed;top:-100px;left:50%;transform:translateX(-50%);
  background:var(--primary);color:#fff;padding:.7rem 1.2rem;
  border-radius:0 0 12px 12px;z-index:9999;font-weight:600;
  transition:top .2s var(--ease);
}
.skip-link:focus{top:0;}

/* ============================================================
   3. ICON SYSTEM (Iconify + fallback)
   ============================================================ */
iconify-icon{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:1em;height:1em;
  flex:0 0 auto;
  vertical-align:-0.125em;
}
body.icons-failed iconify-icon{
  background:currentColor;
  opacity:.35;
  border-radius:3px;
  width:1em;height:1em;
  vertical-align:middle;
}
body.icons-failed iconify-icon::before{content:"";}

/* ============================================================
   4. LAYOUT
   ============================================================ */
.app{
  display:grid;
  grid-template-columns:var(--sidebar-w) minmax(0,1fr);
  min-height:100vh;
  min-height:100dvh;
  transition:grid-template-columns var(--t) var(--ease);
}
.app.sidebar-collapsed{grid-template-columns:var(--sidebar-w-collapsed) minmax(0,1fr);}

/* ---- Sidebar ---- */
.sidebar{
  position:sticky;top:0;
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  padding:0.85rem;
  background:var(--surface);
  -webkit-backdrop-filter:blur(var(--blur));
  backdrop-filter:blur(var(--blur));
  border-right:1px solid var(--border);
  z-index:40;
  transition:padding var(--t) var(--ease), transform var(--t) var(--ease);
  overflow:hidden;
}
.sidebar-head{
  display:flex;align-items:center;justify-content:space-between;gap:.5rem;
  padding:.35rem .35rem .9rem;
  margin-bottom:.35rem;
  border-bottom:1px solid var(--border-soft);
}
.logo{
  display:flex;align-items:center;gap:.55rem;
  font-weight:700;font-size:1.05rem;
  letter-spacing:-.01em;
  color:var(--text);
  min-width:0;
}
.logo-icon{
  width:34px;height:34px;flex:0 0 auto;
  display:grid;place-items:center;
  border-radius:10px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#fff;font-size:1.05rem;
  box-shadow:0 4px 12px var(--primary-soft);
}
.logo-text{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.sidebar-toggle{
  width:32px;height:32px;
  display:grid;place-items:center;
  border-radius:8px;
  border:1px solid var(--border-soft);
  background:var(--surface-3);
  color:var(--text-muted);
  cursor:pointer;font-size:.95rem;
  transition:transform var(--t) var(--ease), background var(--t) var(--ease), color var(--t) var(--ease);
}
.sidebar-toggle:hover{background:var(--surface-2);color:var(--text);}
.app.sidebar-collapsed .sidebar-toggle iconify-icon{transform:rotate(180deg);}

.sidebar-nav{
  flex:1;
  display:flex;flex-direction:column;gap:.15rem;
  overflow-y:auto;overflow-x:hidden;
  padding:.25rem 0;
  scrollbar-width:thin;
}
.sidebar-nav::-webkit-scrollbar{width:6px;}
.sidebar-nav::-webkit-scrollbar-thumb{background:var(--border-soft);border-radius:99px;}

.nav-item{
  display:flex;align-items:center;gap:.7rem;
  padding:.6rem .7rem;
  border-radius:var(--radius-sm);
  color:var(--text-muted);
  font-size:.9rem;font-weight:500;
  cursor:pointer;
  border:none;background:transparent;
  width:100%;text-align:left;
  white-space:nowrap;
  transition:background var(--t) var(--ease), color var(--t) var(--ease), transform var(--t) var(--ease);
  position:relative;
}
.nav-item iconify-icon{font-size:1.15rem;flex:0 0 auto;}
.nav-item .nav-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;}
.nav-item .nav-badge{
  font-size:.7rem;font-weight:700;
  padding:.05rem .4rem;
  border-radius:99px;
  background:var(--primary-soft);
  color:var(--primary);
  font-variant-numeric:tabular-nums;
  min-width:20px;text-align:center;
}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item[aria-current="page"]{
  background:var(--primary-soft);
  color:var(--primary);
  font-weight:600;
}
.nav-item[aria-current="page"]::before{
  content:"";position:absolute;left:0;top:20%;bottom:20%;width:3px;
  border-radius:0 3px 3px 0;background:var(--primary);
}

.sidebar-foot{padding-top:.75rem;border-top:1px solid var(--border-soft);margin-top:.35rem;}
.sidebar-add{
  width:100%;display:flex;align-items:center;justify-content:center;gap:.5rem;
  padding:.65rem .9rem;
  border-radius:var(--radius-sm);
  border:none;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#fff;font-weight:600;font-size:.9rem;
  cursor:pointer;
  box-shadow:0 4px 14px var(--primary-soft);
  transition:transform var(--t) var(--ease), box-shadow var(--t) var(--ease);
}
.sidebar-add:hover{transform:translateY(-1px);box-shadow:0 8px 20px var(--primary-soft);}

.app.sidebar-collapsed .logo-text,
.app.sidebar-collapsed .nav-label,
.app.sidebar-collapsed .nav-badge,
.app.sidebar-collapsed .sidebar-add span{display:none;}
.app.sidebar-collapsed .nav-item{justify-content:center;padding:.65rem;}
.app.sidebar-collapsed .sidebar-add{padding:.65rem;}
.app.sidebar-collapsed .sidebar-head{justify-content:center;padding-bottom:.9rem;}
.app.sidebar-collapsed .sidebar-toggle{position:absolute;right:-14px;top:18px;z-index:5;}

/* ---- Main area ---- */
.main-area{
  display:flex;flex-direction:column;
  min-width:0;
  min-height:100vh;min-height:100dvh;
}

.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:.75rem;
  height:var(--topbar-h);
  padding:0 clamp(.75rem,2.5vw,1.5rem);
  background:var(--surface-2);
  -webkit-backdrop-filter:blur(var(--blur));
  backdrop-filter:blur(var(--blur));
  border-bottom:1px solid var(--border);
}
.page-title{
  font-size:1.1rem;font-weight:700;letter-spacing:-.01em;
  flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.topbar-actions{display:flex;align-items:center;gap:.4rem;flex:0 0 auto;}

.icon-btn{
  display:inline-grid;place-items:center;
  width:40px;height:40px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border-soft);
  background:var(--surface-3);
  color:var(--text);
  cursor:pointer;font-size:1.1rem;
  transition:background var(--t) var(--ease), transform var(--t) var(--ease), color var(--t) var(--ease);
}
.icon-btn:hover{background:var(--surface-2);transform:translateY(-1px);}
.icon-btn:active{transform:scale(.96);}
.icon-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
.icon-btn.primary:hover{background:var(--accent);border-color:var(--accent);}

.page-content{
  flex:1;
  padding:clamp(1rem,3vw,1.75rem) clamp(.75rem,3vw,1.75rem) calc(2rem + env(safe-area-inset-bottom,0px));
  max-width:1400px;width:100%;margin:0 auto;
}
.page-content:focus{outline:none;}

/* ---- Bottom nav (mobile) ---- */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;z-index:45;
  display:none;
  justify-content:space-around;
  gap:.15rem;
  padding:.4rem .35rem calc(.4rem + env(safe-area-inset-bottom,0px));
  background:var(--surface);
  -webkit-backdrop-filter:blur(var(--blur));
  backdrop-filter:blur(var(--blur));
  border-top:1px solid var(--border);
  box-shadow:0 -4px 20px rgba(0,0,0,.06);
}
.bnav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.12rem;
  padding:.35rem .2rem;
  border:none;background:transparent;
  color:var(--text-muted);
  font-size:.68rem;font-weight:600;
  border-radius:var(--radius-sm);
  cursor:pointer;
  transition:color var(--t) var(--ease), background var(--t) var(--ease);
  min-width:0;
}
.bnav-item iconify-icon{font-size:1.35rem;}
.bnav-item span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.bnav-item[aria-current="page"]{color:var(--primary);background:var(--primary-soft);}

/* ---- Drawer overlay (mobile) ---- */
.drawer-overlay{
  position:fixed;inset:0;z-index:99;
  background:rgba(0,0,0,.45);
  -webkit-backdrop-filter:blur(3px);
  backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;
  transition:opacity var(--t) var(--ease);
}
body.drawer-open .drawer-overlay{opacity:1;pointer-events:auto;}

/* ---- FAB ---- */
.fab{
  position:fixed;
  right:calc(1rem + env(safe-area-inset-right,0px));
  bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));
  width:56px;height:56px;
  border-radius:50%;
  border:none;
  display:grid;place-items:center;
  font-size:1.5rem;
  color:#fff;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  box-shadow:0 8px 24px var(--primary-soft);
  cursor:pointer;z-index:50;
  transition:transform var(--t) var(--ease), box-shadow var(--t) var(--ease);
}
.fab:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 12px 30px var(--primary-soft);}
.fab:active{transform:scale(.95);}

/* ============================================================
   5. COMMON COMPONENTS
   ============================================================ */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(var(--blur));
  backdrop-filter:blur(var(--blur));
  padding:var(--pad-card);
}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .card,.sidebar,.topbar,.bottom-nav,.modal-card,.task-card,.toast{
    background:var(--surface-solid) !important;
  }
}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  padding:.65rem 1.05rem;
  min-height:42px;
  border-radius:var(--radius-sm);
  border:1px solid transparent;
  font-weight:600;font-size:.9rem;
  cursor:pointer;
  transition:transform var(--t) var(--ease), box-shadow var(--t) var(--ease), background var(--t) var(--ease), opacity var(--t) var(--ease);
  white-space:nowrap;
}
.btn iconify-icon{font-size:1.05rem;}
.btn:active{transform:scale(.98);}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;box-shadow:0 4px 14px var(--primary-soft);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px var(--primary-soft);}
.btn-ghost{background:var(--surface-3);border-color:var(--border-soft);color:var(--text);}
.btn-ghost:hover{background:var(--surface-2);}
.btn-danger{background:var(--danger);color:#fff;}
.btn-danger:hover{filter:brightness(1.08);}
.btn-sm{padding:.4rem .75rem;min-height:34px;font-size:.8rem;}
.btn[disabled]{opacity:.55;cursor:not-allowed;transform:none !important;}

.input,
.textarea,
.select{
  width:100%;
  padding:.7rem .85rem;
  min-height:42px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border-soft);
  background:var(--surface-3);
  color:var(--text);
  font-size:.92rem;
  transition:border-color var(--t) var(--ease), box-shadow var(--t) var(--ease), background var(--t) var(--ease);
  -webkit-appearance:none;
  appearance:none;
}
.input::placeholder,.textarea::placeholder{color:var(--text-muted);opacity:.8;}
.input:focus,.textarea:focus,.select:focus{
  outline:none;
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--primary-soft);
  background:var(--surface-2);
}
.input[aria-invalid="true"],.textarea[aria-invalid="true"]{
  border-color:var(--danger);
  box-shadow:0 0 0 3px var(--danger-soft);
}
.textarea{min-height:80px;resize:vertical;line-height:1.5;}

.field{margin-bottom:.9rem;min-width:0;}
.field > label,
.field-label{
  display:block;margin-bottom:.35rem;
  font-size:.8rem;font-weight:600;
  color:var(--text-muted);
}
.field .req{color:var(--danger);}
.field .opt{font-weight:400;opacity:.75;}
.field-error{margin-top:.3rem;font-size:.76rem;font-weight:600;color:var(--danger);}
.field-row{display:grid;grid-template-columns:1fr;gap:.75rem;}

/* Chips */
.chip{
  display:inline-flex;align-items:center;gap:.35rem;
  padding:.42rem .8rem;
  border-radius:99px;
  border:1px solid var(--border-soft);
  background:var(--surface-3);
  color:var(--text);
  font-size:.8rem;font-weight:600;
  cursor:pointer;white-space:nowrap;
  transition:background var(--t) var(--ease), color var(--t) var(--ease), border-color var(--t) var(--ease), transform var(--t) var(--ease);
}
.chip:hover{transform:translateY(-1px);border-color:var(--primary);}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff;}
.chip.p-low[aria-pressed="true"]{background:var(--success);border-color:var(--success);}
.chip.p-medium[aria-pressed="true"]{background:var(--warning);border-color:var(--warning);}
.chip.p-high[aria-pressed="true"]{background:var(--danger);border-color:var(--danger);}

.chip-row{
  display:flex;gap:.4rem;
  overflow-x:auto;
  padding-bottom:.35rem;
  scrollbar-width:thin;
  -webkit-overflow-scrolling:touch;
}
.chip-row::-webkit-scrollbar{height:5px;}
.chip-row::-webkit-scrollbar-thumb{background:var(--border-soft);border-radius:99px;}

/* Switch */
.switch{position:relative;display:inline-block;width:46px;height:26px;flex:0 0 auto;}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1;}
.switch .track{
  position:absolute;inset:0;
  background:var(--border-soft);
  border-radius:99px;
  transition:background var(--t) var(--ease);
}
.switch .track::after{
  content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;
  border-radius:50%;background:#fff;
  box-shadow:0 2px 5px rgba(0,0,0,.22);
  transition:transform var(--t) var(--ease);
}
.switch input:checked + .track{background:var(--primary);}
.switch input:checked + .track::after{transform:translateX(20px);}

/* Segmented */
.segmented{
  display:flex;gap:.25rem;
  background:var(--surface-3);
  border:1px solid var(--border-soft);
  border-radius:var(--radius-sm);
  padding:.22rem;
}
.segmented label{flex:1;position:relative;display:block;}
.segmented input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;}
.segmented span{
  display:flex;align-items:center;justify-content:center;gap:.3rem;
  padding:.45rem .3rem;border-radius:8px;
  font-size:.78rem;font-weight:600;text-align:center;
  transition:background var(--t) var(--ease), color var(--t) var(--ease);
  pointer-events:none;
}
.segmented input:checked + span{background:var(--primary);color:#fff;}
.segmented input:focus-visible + span{outline:2px solid var(--primary);outline-offset:2px;}
.segmented .seg-low input:checked + span{background:var(--success);}
.segmented .seg-medium input:checked + span{background:var(--warning);}
.segmented .seg-high input:checked + span{background:var(--danger);}

/* Slider */
input[type="range"]{
  width:100%;height:22px;
  -webkit-appearance:none;appearance:none;
  background:transparent;cursor:pointer;
}
input[type="range"]::-webkit-slider-runnable-track{
  height:6px;border-radius:99px;background:var(--border-soft);
}
input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:18px;height:18px;margin-top:-6px;
  border-radius:50%;background:var(--primary);
  border:2px solid #fff;
  box-shadow:0 2px 6px rgba(0,0,0,.25);
}
input[type="range"]::-moz-range-track{height:6px;border-radius:99px;background:var(--border-soft);}
input[type="range"]::-moz-range-thumb{
  width:16px;height:16px;border-radius:50%;
  background:var(--primary);border:2px solid #fff;
}

/* ============================================================
   6. TASK CARD
   ============================================================ */
.task-card{
  position:relative;
  display:grid;
  grid-template-columns:1fr;
  gap:.65rem;
  padding:var(--pad-card);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(var(--blur));
  backdrop-filter:blur(var(--blur));
  transition:transform var(--t) var(--ease), box-shadow var(--t) var(--ease), opacity var(--t) var(--ease);
  animation:cardIn .32s var(--ease) both;
}
body.motion-reduced .task-card,
body.density-compact .task-card{animation-duration:.01ms;}

.task-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  border-radius:3px 0 0 3px;
  background:transparent;
  transition:background var(--t) var(--ease);
}
.task-card.is-pinned::before{background:var(--primary);}
.task-card.is-overdue::before{background:var(--danger);}
.task-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.task-card.is-done{opacity:.62;}
.task-card.is-done .task-title{text-decoration:line-through;text-decoration-thickness:2px;}

.task-top{display:flex;gap:.65rem;align-items:flex-start;min-width:0;}

.task-check{
  flex:0 0 auto;
  width:28px;height:28px;margin-top:1px;
  border-radius:50%;
  border:2px solid var(--border-soft);
  background:var(--surface-3);
  color:transparent;
  display:grid;place-items:center;
  cursor:pointer;font-size:.95rem;
  transition:background var(--t) var(--ease), border-color var(--t) var(--ease), color var(--t) var(--ease), transform var(--t) var(--ease);
}
.task-check:hover{transform:scale(1.08);}
.task-card.status-todo .task-check{border-color:var(--text-muted);}
.task-card.status-progress .task-check{
  border-color:var(--warning);
  background:var(--warning-soft);
  color:var(--warning);
}
.task-card.status-done .task-check{
  border-color:var(--success);
  background:var(--success);
  color:#fff;
}

.task-body{flex:1;min-width:0;cursor:pointer;}
.task-title{
  font-size:.98rem;font-weight:600;line-height:1.35;
  word-break:break-word;overflow-wrap:anywhere;
}
.task-desc{
  margin-top:.15rem;
  font-size:.84rem;color:var(--text-muted);
  line-height:1.45;
  word-break:break-word;overflow-wrap:anywhere;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
body.density-compact .task-desc{display:none;}

.task-meta{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem;}
.meta{
  display:inline-flex;align-items:center;gap:.28rem;
  padding:.2rem .5rem;border-radius:99px;
  font-size:.7rem;font-weight:600;line-height:1.4;
  border:1px solid transparent;white-space:nowrap;
}
.meta iconify-icon{font-size:.85rem;}
.meta-status{background:var(--surface-3);border-color:var(--border-soft);color:var(--text-muted);}
.meta-status.s-progress{background:var(--warning-soft);color:var(--warning);}
.meta-status.s-done{background:var(--success-soft);color:var(--success);}
.meta-priority.p-low{background:var(--success-soft);color:var(--success);}
.meta-priority.p-medium{background:var(--warning-soft);color:var(--warning);}
.meta-priority.p-high{background:var(--danger-soft);color:var(--danger);}
.meta-cat{background:var(--primary-soft);color:var(--primary);}
.meta-loc{background:var(--accent-soft);color:var(--accent);}
.meta-date{background:var(--surface-3);border-color:var(--border-soft);color:var(--text-muted);}
.meta-date.is-overdue{background:var(--danger-soft);color:var(--danger);}
.meta-date.is-today{background:var(--warning-soft);color:var(--warning);}
.meta-note{background:var(--surface-3);border-color:var(--border-soft);color:var(--text-muted);}

.task-actions{display:flex;gap:.3rem;justify-content:flex-end;align-items:center;flex-wrap:wrap;}
.task-btn{
  width:34px;height:34px;
  display:grid;place-items:center;
  border-radius:var(--radius-sm);
  border:1px solid var(--border-soft);
  background:var(--surface-3);
  color:var(--text-muted);
  cursor:pointer;font-size:1rem;
  transition:background var(--t) var(--ease), color var(--t) var(--ease), transform var(--t) var(--ease);
}
.task-btn:hover{transform:translateY(-1px);}
.task-btn[data-action="edit"]:hover{background:var(--primary-soft);color:var(--primary);}
.task-btn[data-action="pin"]:hover,
.task-btn[data-action="pin"].is-active{background:var(--warning-soft);color:var(--warning);}
.task-btn[data-action="delete"]:hover{background:var(--danger-soft);color:var(--danger);}

/* ============================================================
   7. DASHBOARD
   ============================================================ */
.greeting{margin-bottom:1.1rem;}
.greeting h2{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;line-height:1.2;}
.greeting p{font-size:.87rem;color:var(--text-muted);margin-top:.15rem;}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:var(--gap-grid);
  margin-bottom:var(--gap-grid);
}
.stat-card{
  display:flex;flex-direction:column;gap:.35rem;
  padding:var(--pad-card);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(var(--blur));
  backdrop-filter:blur(var(--blur));
  transition:transform var(--t) var(--ease);
  position:relative;
  overflow:hidden;
}
.stat-card:hover{transform:translateY(-2px);}
.stat-icon{
  width:36px;height:36px;display:grid;place-items:center;
  border-radius:10px;
  background:var(--primary-soft);
  color:var(--primary);
  font-size:1.15rem;
  margin-bottom:.15rem;
}
.stat-icon.success{background:var(--success-soft);color:var(--success);}
.stat-icon.warning{background:var(--warning-soft);color:var(--warning);}
.stat-icon.danger{background:var(--danger-soft);color:var(--danger);}
.stat-value{
  font-size:1.7rem;font-weight:700;letter-spacing:-.02em;line-height:1.1;
  font-variant-numeric:tabular-nums;
}
.stat-label{font-size:.78rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.04em;}

.progress-card{
  padding:var(--pad-card);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(var(--blur));
  backdrop-filter:blur(var(--blur));
  margin-bottom:var(--gap-grid);
}
.progress-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.7rem;}
.progress-head h3{font-size:.95rem;font-weight:700;}
.progress-head .pct{font-size:1.5rem;font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums;}
.progress-bar{
  height:10px;border-radius:99px;
  background:var(--surface-3);
  border:1px solid var(--border-soft);
  overflow:hidden;
}
.progress-fill{
  display:block;height:100%;width:0%;
  border-radius:99px;
  background:linear-gradient(90deg,var(--primary),var(--accent));
  transition:width var(--t-slow) var(--ease);
}
.progress-meta{display:flex;justify-content:space-between;font-size:.78rem;color:var(--text-muted);margin-top:.5rem;}

.quick-grid{
  display:grid;grid-template-columns:repeat(2,1fr);
  gap:.65rem;margin-bottom:var(--gap-grid);
}
.quick-action{
  display:flex;align-items:center;gap:.6rem;
  padding:.8rem;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(var(--blur));
  backdrop-filter:blur(var(--blur));
  cursor:pointer;
  color:var(--text);
  font-size:.86rem;font-weight:600;
  text-align:left;
  transition:transform var(--t) var(--ease), box-shadow var(--t) var(--ease);
}
.quick-action:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
.quick-action .qa-icon{
  width:36px;height:36px;flex:0 0 auto;
  display:grid;place-items:center;
  border-radius:10px;
  background:var(--primary-soft);color:var(--primary);
  font-size:1.1rem;
}
.quick-action.danger .qa-icon{background:var(--danger-soft);color:var(--danger);}
.quick-action.success .qa-icon{background:var(--success-soft);color:var(--success);}
.quick-action.warning .qa-icon{background:var(--warning-soft);color:var(--warning);}

.section-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:.75rem;margin:1.2rem 0 .65rem;
}
.section-head h3{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:.4rem;}
.section-link{
  background:none;border:none;color:var(--primary);font-size:.82rem;font-weight:600;
  cursor:pointer;display:inline-flex;align-items:center;gap:.25rem;padding:.3rem .4rem;
  border-radius:6px;
}
.section-link:hover{background:var(--primary-soft);}

.priority-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.55rem;}
.priority-card{
  padding:.8rem .6rem;
  border-radius:var(--radius);
  border:1px solid var(--border);
  background:var(--surface);
  -webkit-backdrop-filter:blur(var(--blur));
  backdrop-filter:blur(var(--blur));
  text-align:center;
}
.priority-card .p-count{font-size:1.35rem;font-weight:700;font-variant-numeric:tabular-nums;}
.priority-card .p-label{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);margin-top:.1rem;}
.priority-card.high .p-count{color:var(--danger);}
.priority-card.medium .p-count{color:var(--warning);}
.priority-card.low .p-count{color:var(--success);}

.task-list{display:flex;flex-direction:column;gap:var(--gap-list);}

/* ============================================================
   8. PAGE: TASKS / LISTS
   ============================================================ */
.page-toolbar{
  display:flex;flex-direction:column;gap:.6rem;
  margin-bottom:1rem;
}
.toolbar-row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;}
.toolbar-search{
  flex:1 1 220px;min-width:0;
  position:relative;
}
.toolbar-search iconify-icon{
  position:absolute;left:.85rem;top:50%;transform:translateY(-50%);
  color:var(--text-muted);font-size:1rem;pointer-events:none;
}
.toolbar-search .input{padding-left:2.5rem;padding-right:2.4rem;}
.toolbar-search .clear-btn{
  position:absolute;right:.4rem;top:50%;transform:translateY(-50%);
  width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;
  border:none;background:var(--surface-3);color:var(--text-muted);
  cursor:pointer;font-size:.85rem;
}
.toolbar-search .clear-btn:hover{background:var(--danger-soft);color:var(--danger);}

.filters-card{
  padding:.8rem;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:var(--radius);
  -webkit-backdrop-filter:blur(var(--blur));
  backdrop-filter:blur(var(--blur));
  margin-bottom:1rem;
  display:flex;flex-direction:column;gap:.5rem;
}
.filters-foot{
  display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;
  padding-top:.5rem;border-top:1px solid var(--border-soft);
}
.filters-foot label{font-size:.78rem;font-weight:600;color:var(--text-muted);}
.filters-foot .select{flex:1 1 130px;min-width:0;padding:.45rem .65rem;min-height:36px;font-size:.82rem;}

/* Empty state */
.empty-state{
  text-align:center;
  padding:2.5rem 1.25rem;
  border-radius:var(--radius);
  border:1px dashed var(--border-soft);
  background:var(--surface-2);
  -webkit-backdrop-filter:blur(var(--blur));
  backdrop-filter:blur(var(--blur));
  animation:cardIn .32s var(--ease) both;
}
.empty-state .empty-icon{
  width:56px;height:56px;margin:0 auto .8rem;
  display:grid;place-items:center;
  border-radius:50%;
  background:var(--primary-soft);color:var(--primary);
  font-size:1.6rem;
}
.empty-state h3{font-size:1.05rem;font-weight:700;margin-bottom:.3rem;}
.empty-state p{font-size:.86rem;color:var(--text-muted);margin-bottom:1rem;}
.empty-state .btn{display:inline-flex;}

/* ============================================================
   9. CALENDAR
   ============================================================ */
.cal-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:.5rem;margin-bottom:.85rem;
}
.cal-title{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;text-transform:capitalize;}
.cal-nav{display:flex;gap:.35rem;}

.cal-card{
  padding:var(--pad-card);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(var(--blur));
  backdrop-filter:blur(var(--blur));
  margin-bottom:1rem;
}
.cal-weekdays{
  display:grid;grid-template-columns:repeat(7,1fr);
  gap:.25rem;margin-bottom:.4rem;
  font-size:.7rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.04em;color:var(--text-muted);text-align:center;
}
.cal-grid{
  display:grid;grid-template-columns:repeat(7,1fr);
  gap:.25rem;
}
.cal-day{
  position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:.15rem;
  min-height:44px;
  padding:.25rem .1rem;
  border-radius:var(--radius-sm);
  border:1px solid transparent;
  background:var(--surface-3);
  color:var(--text);
  font-size:.85rem;
  cursor:pointer;
  transition:background var(--t) var(--ease), border-color var(--t) var(--ease), transform var(--t) var(--ease);
}
.cal-day:hover{background:var(--surface-2);border-color:var(--border);}
.cal-day.other-month{opacity:.35;}
.cal-day.is-today{background:var(--primary-soft);color:var(--primary);font-weight:700;}
.cal-day.is-selected{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft);}
.cal-day .dnum{font-weight:600;line-height:1;}
.cal-dots{display:flex;gap:.15rem;flex-wrap:wrap;justify-content:center;}
.cal-dot{width:5px;height:5px;border-radius:50%;display:block;}
.cal-dot.high{background:var(--danger);}
.cal-dot.medium{background:var(--warning);}
.cal-dot.low{background:var(--success);}
.cal-more{font-size:.62rem;color:var(--text-muted);font-weight:700;}

.cal-day-panel{margin-top:1rem;}
.cal-day-panel h3{font-size:1rem;font-weight:700;margin-bottom:.65rem;display:flex;align-items:center;gap:.4rem;}

/* ============================================================
   10. STATISTICS
   ============================================================ */
.stats-page-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:var(--gap-grid);
  margin-bottom:var(--gap-grid);
}
.big-stat{
  padding:var(--pad-card);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(var(--blur));
  backdrop-filter:blur(var(--blur));
}
.big-stat .bs-value{font-size:2rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;}
.big-stat .bs-label{font-size:.8rem;font-weight:600;color:var(--text-muted);margin-top:.2rem;}
.big-stat .bs-icon{
  width:36px;height:36px;display:grid;place-items:center;
  border-radius:10px;background:var(--primary-soft);color:var(--primary);
  font-size:1.1rem;margin-bottom:.5rem;
}
.big-stat .bs-icon.success{background:var(--success-soft);color:var(--success);}
.big-stat .bs-icon.warning{background:var(--warning-soft);color:var(--warning);}
.big-stat .bs-icon.danger{background:var(--danger-soft);color:var(--danger);}

.breakdown-card{
  padding:var(--pad-card);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(var(--blur));
  backdrop-filter:blur(var(--blur));
  margin-bottom:var(--gap-grid);
}
.breakdown-card h3{font-size:.95rem;font-weight:700;margin-bottom:.85rem;}
.breakdown-row{display:flex;flex-direction:column;gap:.35rem;margin-bottom:.7rem;}
.breakdown-row:last-child{margin-bottom:0;}
.bd-head{display:flex;justify-content:space-between;font-size:.82rem;font-weight:600;}
.bd-head .bd-count{color:var(--text-muted);font-variant-numeric:tabular-nums;}
.bd-bar{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;}

.recent-list{display:flex;flex-direction:column;gap:.45rem;}
.recent-item{
  display:flex;align-items:center;gap:.55rem;
  padding:.5rem .65rem;
  border-radius:var(--radius-sm);
  background:var(--surface-3);
  font-size:.85rem;
}
.recent-item .ri-icon{
  width:26px;height:26px;flex:0 0 auto;

  border-radius:50%;
  background:var(--success-soft);color:var(--success);

}
.recent-item .ri-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.recent-item .ri-date{font-size:.72rem;color:var(--text-muted);flex:0 0 auto;}

/* ============================================================
   11. SETTINGS
   ============================================================ */
.settings-search{
  position:relative;margin-bottom:1rem;
}
.settings-search iconify-icon{
  position:absolute;left:.85rem;top:50%;transform:translateY(-50%);
  color:var(--text-muted);font-size:1rem;pointer-events:none;
}
.settings-search .input{padding-left:2.5rem;}

.settings-card{
  padding:var(--pad-card);
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(var(--blur));
  backdrop-filter:blur(var(--blur));
  margin-bottom:var(--gap-grid);
}
.settings-card h3{
  font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;

}
.settings-card h3 iconify-icon{font-size:1rem;color:var(--primary);}
.settings-row{

}
.settings-row:last-child{border-bottom:none;padding-bottom:0;}
.settings-row:first-of-type{padding-top:0;}
.settings-row .sr-text{flex:1;min-width:0;}
.settings-row .sr-title{font-size:.9rem;font-weight:600;line-height:1.35;}
.settings-row .sr-desc{font-size:.76rem;color:var(--text-muted);margin-top:.1rem;line-height:1.4;}
.settings-row .sr-control{flex:0 0 auto;display:flex;align-items:center;gap:.4rem;}

.palette-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:.5rem;margin-top:.4rem;
}
.palette-option{
  position:relative;
  display:flex;flex-direction:column;gap:.35rem;
  padding:.45rem;
  border-radius:var(--radius-sm);
  border:1px solid var(--border-soft);
  background:var(--surface-3);

  transition:border-color var(--t) var(--ease), background var(--t) var(--ease), transform var(--t) var(--ease);
}
.palette-option:hover{transform:translateY(-2px);border-color:var(--primary);}
.palette-option[aria-pressed="true"]{

}
.palette-swatch{

  border-radius:6px;
  border:1px solid rgba(0,0,0,.06);
}
.palette-name{
  font-size:.74rem;font-weight:600;text-align:center;

}
.palette-check{
  position:absolute;top:.25rem;right:.25rem;

  border-radius:50%;

  transition:opacity var(--t) var(--ease), transform var(--t) var(--ease);

.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.4rem;margin-top:.4rem;}
.theme-btn{
  display:flex;flex-direction:column;align-items:center;gap:.3rem;
  padding:.7rem .4rem;
  border-radius:var(--radius-sm);
  border:1px solid var(--border-soft);
  background:var(--surface-3);
  cursor:pointer;
  font-size:.78rem;font-weight:600;
  transition:border-color var(--t) var(--ease), background var(--t) var(--ease), transform var(--t) var(--ease);
}
.theme-btn:hover{transform:translateY(-1px);}
.theme-btn[aria-pressed="true"]{
  border-color:var(--primary);
  background:var(--primary-soft);
  box-shadow:0 0 0 2px var(--primary-soft);
}
.theme-btn iconify-icon{font-size:1.3rem;}

.slider-row{
  display:grid;grid-template-columns:1fr;gap:.3rem;
  padding:.6rem 0;
}
.slider-row .sl-head{
  display:flex;justify-content:space-between;align-items:center;
  font-size:.82rem;font-weight:600;color:var(--text-muted);
}
.slider-row .sl-val{
  font-variant-numeric:tabular-nums;font-weight:700;color:var(--text);
}

.dashboard-toggles{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;}
.dash-toggle{
  display:flex;align-items:center;gap:.5rem;
  padding:.55rem .65rem;
  border-radius:var(--radius-sm);
  border:1px solid var(--border-soft);
  background:var(--surface-3);
  cursor:pointer;
  font-size:.82rem;font-weight:500;
  transition:background var(--t) var(--ease), border-color var(--t) var(--ease);
}

.dash-toggle input{width:16px;height:16px;accent-color:var(--primary);cursor:pointer;flex:0 0 auto;}
.dash-toggle span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.data-btn{
  display:flex;align-items:center;gap:.6rem;
  width:100%;padding:.7rem .85rem;
  margin-bottom:.5rem;
  min-height:44px;
  border-radius:var(--radius-sm);
  border:1px solid var(--border-soft);
  background:var(--surface-3);
  color:var(--text);
  font-size:.88rem;font-weight:600;
  text-align:left;cursor:pointer;
  transition:background var(--t) var(--ease), transform var(--t) var(--ease), border-color var(--t) var(--ease);
}
.data-btn:hover{background:var(--surface-2);border-color:var(--primary);transform:translateY(-1px);}
.data-btn iconify-icon{font-size:1.1rem;color:var(--text-muted);}
.data-btn.danger{color:var(--danger);}
.data-btn.danger iconify-icon{color:var(--danger);}
.data-btn:last-child{margin-bottom:0;}

.cat-list{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:.6rem;}
.cat-item{
  display:inline-flex;align-items:center;gap:.3rem;
  padding:.3rem .35rem .3rem .65rem;
  border-radius:99px;
  background:var(--primary-soft);color:var(--primary);
  font-size:.78rem;font-weight:600;
}
.cat-item button{
  display:grid;place-items:center;
  width:20px;height:20px;border:none;border-radius:50%;
  background:transparent;color:inherit;cursor:pointer;font-size:.7rem;
}
.cat-item button:hover{background:rgba(0,0,0,.12);}
.cat-add{display:flex;gap:.4rem;}
.cat-add .input{flex:1;min-width:0;min-height:40px;padding:.5rem .75rem;font-size:.86rem;}
.cat-add .icon-btn{box-shadow:none;}

/* Live preview */
.preview-card{
  padding:var(--pad-card);
  border-radius:var(--radius);
  background:var(--surface);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(var(--blur));
  backdrop-filter:blur(var(--blur));
  margin-bottom:var(--gap-grid);
}
.preview-card h3{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);margin-bottom:.7rem;}
.preview-task{
  display:flex;gap:.6rem;align-items:flex-start;
  padding:.7rem;
  border-radius:var(--radius-sm);
  background:var(--surface-3);
  border:1px solid var(--border-soft);
}
.preview-task .pt-check{
  width:22px;height:22px;flex:0 0 auto;border-radius:50%;
  border:2px solid var(--success);background:var(--success);color:#fff;
  display:grid;place-items:center;font-size:.75rem;
}
.preview-task .pt-body{flex:1;min-width:0;}
.preview-task .pt-title{font-size:.86rem;font-weight:600;}
.preview-task .pt-meta{display:flex;gap:.3rem;flex-wrap:wrap;margin-top:.35rem;}
.preview-actions{display:flex;gap:.4rem;margin-top:.6rem;flex-wrap:wrap;}

/* ============================================================
   12. ABOUT
   ============================================================ */
.about-card{
  padding:1.5rem 1.25rem;
  text-align:center;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(var(--blur));
  backdrop-filter:blur(var(--blur));
  margin-bottom:var(--gap-grid);
}
.about-logo{
  width:64px;height:64px;margin:0 auto .85rem;
  display:grid;place-items:center;
  border-radius:16px;
  background:linear-gradient(135deg,var(--primary),var(--accent));
  color:#fff;font-size:2rem;
  box-shadow:0 8px 24px var(--primary-soft);
}
.about-title{font-size:1.35rem;font-weight:700;letter-spacing:-.02em;}
.about-version{font-size:.82rem;color:var(--text-muted);margin-top:.2rem;}
.about-desc{font-size:.88rem;color:var(--text-muted);margin-top:.9rem;line-height:1.55;max-width:440px;margin-left:auto;margin-right:auto;}

.feature-list{display:grid;grid-template-columns:1fr;gap:.45rem;margin-top:1rem;text-align:left;}
.feature-item{
  display:flex;align-items:flex-start;gap:.55rem;
  padding:.55rem .65rem;
  border-radius:var(--radius-sm);
  background:var(--surface-3);
  font-size:.84rem;
}
.feature-item iconify-icon{color:var(--success);font-size:1.05rem;flex:0 0 auto;margin-top:.05rem;}
.feature-item strong{display:block;font-weight:600;}
.feature-item span{color:var(--text-muted);font-size:.78rem;}

/* ============================================================
   13. MODALS
   ============================================================ */
.modal{
  position:fixed;inset:0;z-index:200;
  display:none;align-items:center;justify-content:center;
  padding:1rem;
}
.modal.active{display:flex;}
.modal-card{
  width:100%;max-width:600px;
  max-height:calc(100vh - 2rem);max-height:calc(100dvh - 2rem);
  overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
  padding:1.25rem;
  border-radius:var(--radius);
  border:1px solid var(--border);
  background:var(--surface);
  -webkit-backdrop-filter:blur(calc(var(--blur) + 6px));
  backdrop-filter:blur(calc(var(--blur) + 6px));
  box-shadow:var(--shadow-lg);
  animation:modalIn .28s var(--ease) both;
}
body.motion-reduced .modal-card{animation-duration:.01ms;}
.modal-card.narrow{max-width:420px;}
.modal-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:.75rem;margin-bottom:1rem;
}
.modal-title{font-size:1.1rem;font-weight:700;letter-spacing:-.01em;}
.modal-actions{
  display:flex;gap:.55rem;justify-content:flex-end;
  margin-top:1rem;flex-wrap:wrap;
}
.modal-actions .btn{flex:1 1 110px;}

/* ============================================================
   14. TOASTS
   ============================================================ */
.toast-container{
  position:fixed;
  left:calc(.75rem + env(safe-area-inset-left,0px));
  right:calc(.75rem + env(safe-area-inset-right,0px));
  bottom:calc(.75rem + env(safe-area-inset-bottom,0px));
  z-index:500;
  display:flex;flex-direction:column;gap:.5rem;
  pointer-events:none;
}
.toast{
  display:flex;align-items:flex-start;gap:.6rem;
  padding:.7rem .8rem;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background:var(--surface);
  -webkit-backdrop-filter:blur(calc(var(--blur) + 6px));
  backdrop-filter:blur(calc(var(--blur) + 6px));
  box-shadow:var(--shadow-lg);
  font-size:.84rem;
  pointer-events:auto;
  animation:toastIn .28s var(--ease) both;
}
.toast.leaving{animation:toastOut .22s var(--ease) both;}
.toast-icon{
  width:26px;height:26px;flex:0 0 auto;
  display:grid;place-items:center;border-radius:50%;font-size:.9rem;
}
.toast.success .toast-icon{background:var(--success-soft);color:var(--success);}
.toast.error .toast-icon{background:var(--danger-soft);color:var(--danger);}
.toast.warning .toast-icon{background:var(--warning-soft);color:var(--warning);}
.toast.info .toast-icon{background:var(--primary-soft);color:var(--primary);}
.toast-body{flex:1;min-width:0;line-height:1.4;word-break:break-word;}
.toast-close{
  background:none;border:none;color:var(--text-muted);cursor:pointer;
  padding:.1rem;font-size:.9rem;display:grid;place-items:center;border-radius:6px;
}
.toast-close:hover{color:var(--text);}

/* ============================================================
   15. ANIMATIONS
   ============================================================ */
@keyframes cardIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.97);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes toastIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes toastOut{from{opacity:1;transform:translateY(0);}to{opacity:0;transform:translateY(8px);}}
@keyframes pageIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.page-enter{animation:pageIn .26s var(--ease) both;}

/* Reduced motion */
body.motion-reduced *,
body.motion-reduced *::before,
body.motion-reduced *::after{
  animation-duration:.01ms !important;
  animation-iteration-count:1 !important;
  transition-duration:.01ms !important;
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}

/* ============================================================
   16. RESPONSIVE
   ============================================================ */
@media (max-width: 1023px){
  .app{grid-template-columns:1fr;}
  .app.sidebar-collapsed{grid-template-columns:1fr;}
  .sidebar{display:none;}
}

@media (max-width: 767px){
  :root{--topbar-h:56px;}
  .app{grid-template-columns:1fr;}
  .sidebar{
    position:fixed;left:0;top:0;bottom:0;width:min(290px,86vw);
    transform:translateX(-100%);
    z-index:100;
    padding-top:calc(.85rem + env(safe-area-inset-top,0px));
    display:flex;
  }
  body.drawer-open .sidebar{transform:translateX(0);}
  .bottom-nav{display:flex;}
  .page-content{padding-bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));}
  .fab{bottom:calc(var(--bottom-nav-h) + .9rem + env(safe-area-inset-bottom,0px));}
  .mobile-only{display:inline-grid !important;}
  .desktop-only{display:none !important;}
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  .quick-grid{grid-template-columns:1fr 1fr;}
  .stats-page-grid{grid-template-columns:1fr 1fr;}
  .modal{padding:.65rem;align-items:flex-end;}
  .modal-card{max-height:calc(100dvh - 1.3rem);padding:1.1rem;}
  .toast-container{bottom:calc(var(--bottom-nav-h) + .6rem + env(safe-area-inset-bottom,0px));}
  .palette-grid{grid-template-columns:repeat(3,1fr);}
  .dashboard-toggles{grid-template-columns:1fr;}
}

@media (min-width: 560px){
  .stats-grid{grid-template-columns:repeat(4,1fr);}
  .quick-grid{grid-template-columns:repeat(4,1fr);}
  .field-row{grid-template-columns:1fr 1fr;}
  .feature-list{grid-template-columns:1fr 1fr;}
  .toast-container{
    left:auto;right:1rem;bottom:1rem;width:min(360px,calc(100% - 2rem));
  }
}

@media (min-width: 1024px){
  .mobile-only{display:none !important;}
  .fab{bottom:2rem;right:2rem;}
  .stats-grid{grid-template-columns:repeat(4,1fr);}
}

/* Print */
@media print{
  .sidebar,.topbar,.bottom-nav,.fab,.toast-container,.task-actions{display:none !important;}
  body::before,body::after{display:none;}
  .page-content{padding:0;}
  .card,.task-card,.stat-card{box-shadow:none;border:1px solid #ccc;background:#fff;}
}
</style>

<body>

<a class="skip-link" href="#main">Skip to content</a>

<div class="app" id="app">

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="sidebar-head">
      <a class="logo" href="#/dashboard" id="logoLink">
        <span class="logo-icon"><iconify-icon icon="solar:layers-minimalistic-linear"></iconify-icon></span>
        <span class="logo-text">Nova Glass</span>
      </a>
      <button class="sidebar-toggle" id="sidebarToggle" aria-label="Collapse sidebar" title="Collapse sidebar">
        <iconify-icon icon="solar:double-alt-arrow-left-linear"></iconify-icon>
      </button>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-foot">
      <button type="button" class="sidebar-add" id="sidebarAddBtn">
        <iconify-icon icon="solar:add-circle-linear"></iconify-icon>
        <span>New Task</span>
      </button>
    </div>
  </aside>

  <!-- ================= MAIN ================= -->
  <div class="main-area">
    <header class="topbar">
      <button type="button" class="icon-btn mobile-only" id="drawerBtn" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
        <iconify-icon icon="solar:hamburger-menu-linear"></iconify-icon>
      </button>
      <h1 class="page-title" id="pageTitle">Dashboard</h1>
      <div class="topbar-actions">
        <button type="button" class="icon-btn" id="topSearchBtn" aria-label="Search tasks" title="Search (/)">
          <iconify-icon icon="solar:magnifer-linear"></iconify-icon>
        </button>
        <button type="button" class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme"></button>
      </div>
    </header>

    <main id="main" class="page-content" tabindex="-1" aria-live="polite"></main>
  </div>
</div>

<!-- ================= BOTTOM NAV ================= -->
<nav class="bottom-nav" id="bottomNav" aria-label="Quick navigation"></nav>
<div class="drawer-overlay" id="drawerOverlay" hidden></div>

<!-- ================= FAB ================= -->
<button type="button" class="fab" id="fab" aria-label="Add new task" title="Add task (N)">
  <iconify-icon icon="solar:add-circle-bold"></iconify-icon>
</button>

<!-- ================= TASK MODAL ================= -->
<div class="modal" id="taskModal" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle">
  <div class="modal-card">
    <div class="modal-head">
      <h2 class="modal-title" id="taskModalTitle">New task</h2>
      <button type="button" class="icon-btn" data-close-modal="taskModal" aria-label="Close dialog">
        <iconify-icon icon="solar:close-circle-linear"></iconify-icon>
      </button>
    </div>
    <form id="taskForm" novalidate>
      <input type="hidden" id="taskId">
      <div class="field">
        <label for="taskTitle">Title <span class="req">*</span></label>
        <input type="text" class="input" id="taskTitle" maxlength="200" required autocomplete="off" aria-describedby="titleError" data-autofocus>
        <p class="field-error" id="titleError" hidden>Please enter a task title.</p>
      </div>
      <div class="field">
        <label for="taskDescription">Description <span class="opt">(optional)</span></label>
        <textarea class="textarea" id="taskDescription" maxlength="1000" rows="2"></textarea>
      </div>
      <div class="field-row">
        <div class="field">
          <span class="field-label" id="priorityLabel">Priority</span>
          <div class="segmented" role="radiogroup" aria-labelledby="priorityLabel">
            <label class="seg-low"><input type="radio" name="priority" value="low"><span>Low</span></label>
            <label class="seg-medium"><input type="radio" name="priority" value="medium" checked><span>Medium</span></label>
            <label class="seg-high"><input type="radio" name="priority" value="high"><span>High</span></label>
          </div>
        </div>
        <div class="field">
          <label for="taskStatus">Status</label>
          <select class="select" id="taskStatus">
            <option value="todo">To Do</option>
            <option value="progress">In Progress</option>
            <option value="done">Completed</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="taskDueDate">Due date <span class="opt">(optional)</span></label>
          <input type="date" class="input" id="taskDueDate">
        </div>
        <div class="field">
          <label for="taskDueTime">Time <span class="opt">(optional)</span></label>
          <input type="time" class="input" id="taskDueTime">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="taskCategory">Category</label>
          <div style="display:flex;gap:.4rem;">
            <select class="select" id="taskCategory" style="flex:1;min-width:0;"></select>
            <button type="button" class="icon-btn" id="addCategoryBtn" aria-label="Add a new category" title="Add category">
              <iconify-icon icon="solar:add-circle-linear"></iconify-icon>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="taskLocation">Location <span class="opt">(optional)</span></label>
          <input type="text" class="input" id="taskLocation" maxlength="100" placeholder="e.g. Home, Office">
        </div>
      </div>
      <div class="field">
        <label for="taskNote">Notes <span class="opt">(optional)</span></label>
        <textarea class="textarea" id="taskNote" maxlength="2000" rows="2" placeholder="Extra details, links, reminders…"></textarea>
      </div>
      <label class="field" style="display:flex;align-items:center;gap:.55rem;cursor:pointer;padding:.6rem .7rem;border-radius:var(--radius-sm);background:var(--surface-3);border:1px solid var(--border-soft);">
        <input type="checkbox" id="taskReminder" style="width:18px;height:18px;accent-color:var(--primary);cursor:pointer;">
        <span style="font-size:.88rem;">Remind me when this task is due</span>
      </label>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close-modal="taskModal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="taskSubmitBtn">
          <iconify-icon icon="solar:check-circle-linear"></iconify-icon>
          <span id="taskSubmitLabel">Add task</span>
        </button>
      </div>
    </form>
  </div>
</div>

<!-- ================= CONFIRM MODAL ================= -->
<div class="modal" id="confirmModal" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmMessage">
  <div class="modal-card narrow">
    <h2 class="modal-title" id="confirmTitle" style="margin-bottom:.45rem;">Confirm action</h2>
    <p id="confirmMessage" style="font-size:.9rem;color:var(--text-muted);margin-bottom:1rem;line-height:1.5;"></p>
    <div class="modal-actions" style="margin-top:0;">
      <button type="button" class="btn btn-ghost" id="confirmCancel">Cancel</button>
      <button type="button" class="btn btn-danger" id="confirmOk">Confirm</button>
    </div>
  </div>
</div>

<!-- ================= TOASTS ================= -->
<div class="toast-container" id="toastContainer" aria-live="polite" aria-atomic="false"></div>
